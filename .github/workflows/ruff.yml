name: Lint & Format

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.9.10

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .
