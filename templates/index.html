<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Social Media App</title>

    <!-- Add Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Add your custom style file -->
    <link rel="stylesheet" href="style.css">

    <meta http-equiv="content-security-policy" content="same-origin require-corp">
</head>
<body>

<header class="container mt-4">
    <h1>Your Social Media</h1>
</header>

<nav class="container">
    <a href="#" class="nav-link" data-section="home">Home</a> |
    <a href="#" class="nav-link" data-section="profile">Profile</a> |
    <a href="#" class="nav-link" data-section="post-feed">Post Feed</a> |
    <a href="#" class="nav-link" data-section="friends">Friends</a> |
    <a href="#" class="nav-link" data-section="messages">Messages</a> |
    <a href="#" class="nav-link" data-section="settings">Settings</a> |
    <a href="#" class="nav-link" data-section="browse">Browse</a> <!-- Browse Section -->
</nav>

<main class="container">

    <!-- Home Section -->
    <div class="section home" style="display: none;">
        <h2>Home Section Content</h2>
        <div class="post-container"></div>
    </div>

    <!-- Profile Section -->
    <div class="section profile" style="display: none;">
        <h2>Your Profile</h2>
        <div class="profile-picture-container">
            <img class="profile-picture" alt="Profile Picture" style="max-width: 200px; max-height: 200px;">
        </div>
        <p class="current-username">Username: <span class="displayed-username">ExampleUser</span></p>

        <label for="newUsername">Update Username:</label>
        <input type="text" id="newUsername" name="newUsername">
        <br>

        <p class="user-age">Age: 25</p>

        <label for="newBioDescription">Update Bio Description:</label>
        <input type="text" id="newBioDescription" name="newBioDescription">
        <br>

        <label for="newUserAge">Update Age:</label>
        <input type="number" id="newUserAge" name="newUserAge">
        <br>

        <label for="profilePictureUpload">Upload Profile Picture:</label>
        <input type="file" accept="image/*" id="profilePictureUpload" name="profilePictureUpload" onchange="previewProfilePicture(event)">
        <br>

        <button onclick="updateProfile()">Update Profile</button>
    </div>

    <!-- Post Feed Section -->
    <div class="section post-feed" style="display: none;">
        <h2>Post Feed Section</h2>
        <h3>Create a New Post</h3>
        <form id="postForm" onsubmit="createPost(event)">
            <label for="postTitle">Title:</label>
            <input type="text" id="postTitle" name="postTitle" required>

            <label for="postContent">Content:</label>
            <textarea id="postContent" name="postContent" rows="4" required></textarea>
            <button type="submit">Post</button>
        </form>
    </div>

    <!-- Friends Section -->
    <div class="section friends" style="display: none;">
        <h2>Your Friends</h2>
        <ul class="friends-list">
            <!-- Friends list will be dynamically populated here -->
        </ul>
    </div>

    <!-- Browse Section -->
    <div class="section browse" style="display: none;">
        <h2>Browse Section</h2>
        <div class="browse-container"></div>
    </div>

    <!-- Messages Section -->
    <div class="section messages" style="display: none;">
        <h2>Messages Section</h2>
        <div class="message-container"></div>
        <label for="searchUsername">Search for user:</label>
        <input type="text" id="searchUsername" name="searchUsername" oninput="searchUsers(event)">
        <ul class="search-results"></ul>
        <form onsubmit="sendMessage(event)">
            <label for="messageText">Type your message:</label>
            <textarea id="messageText" name="messageText" rows="4" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Settings Section -->
    <div class="section settings" style="display: none;">
        <button onclick="logout()">Log Out</button>
    </div>

</main>

<script>
    // Toggle sections based on navigation
    const links = document.querySelectorAll('.nav-link');
    links.forEach(link => {
        link.addEventListener('click', function(event) {
            event.preventDefault();
            const sectionClass = event.target.getAttribute('data-section');
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.querySelector(`.${sectionClass}`).style.display = 'block';
        });
    });

    // Function to update profile (example placeholder)
    function updateProfile() {
        // Update profile logic
        alert('Profile updated!');
    }

    // Function to preview profile picture
    function previewProfilePicture(event) {
        const input = event.target;
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const imageSrc = e.target.result;
                document.querySelector('.profile-picture').src = imageSrc;
            };
            reader.readAsDataURL(file);
        }
    }

    // Function to create a post (example placeholder)
    function createPost(event) {
        event.preventDefault();
        alert('Post created successfully!');
    }

    // Function to log out (example placeholder)
    function logout() {
        alert('Logged out!');
    }

    // Function to search users (example placeholder)
    function searchUsers(event) {
        // Add search logic
    }

    // Function to send a message (example placeholder)
    function sendMessage(event) {
        event.preventDefault();
        alert('Message sent!');
    }
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
