    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="style2.css">
        <!-- Add the Supabase JavaScript client library -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
    <header>
        <img src="logo2.jpg" alt="Logo" class="logo">
        <h1>Login</h1>
    </header>

    <main>
        <form id="login-form" autocomplete="off">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </main>

    <script>
        // Initialize Supabase client
        const supabaseUrl = 'https://uhwtfducivbbwgrgfurm.supabase.co'; // Replace with your Supabase URL
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVod3RmZHVjaXZiYndncmdmdXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjY0NDY5NTEsImV4cCI6MjA0MjAyMjk1MX0.trVnMR9_Ousr1AV3GH94nSRtTwjnhfzvuJ_pq9fG68g'; // Replace with your Supabase anon key
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Handle form submission
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Perform login
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email, // Use email for authentication
                    password: password,
                });

                if (error) {
                    throw error;
                }

                // Handle successful login
                console.log('Logged in successfully:', data);
                alert('Login successful!');
                window.location.href = 'dashboard.html'; // Redirect to a dashboard or home page
            } catch (error) {
                console.error('Error logging in:', error.message);
                alert('Login failed: ' + error.message);
            }
        });
    </script>
    </body>
    </html>
